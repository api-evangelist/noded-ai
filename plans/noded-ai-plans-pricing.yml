note: >-
  Public, itemized, self-serve-visible pricing. Three levers are metered across every tier —
  accounts (customer companies tracked), applications (connected tools), and blocks (units of
  work: an email, transcription, document, record). Seat licensing and platform licensing are
  alternatives, not a ladder. Both an annual and a month-to-month price are published for every
  paid tier. All plan limits are stated as "up to" amounts. Note that Noded's llms.txt describes
  billing in terms of "Outcome Generations" while the live pricing page bills on
  accounts/applications/blocks; the pricing page is treated as authoritative here.
