note: >-
  Noded publishes no error reference page and no OpenAPI, so there are no HTTP status/problem
  types to derive. What IS published is the error taxonomy the first-party SDK raises, and the
  GraphQL error envelope underneath it. That is the whole documented error contract — recorded
  as-is, with nothing invented.
