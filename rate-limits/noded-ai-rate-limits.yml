note: >-
  An honest zero. Noded publishes no rate limits, no throttling policy, no response headers, and
  no exhaustion status code. Searched the developer page, AGENTS.md, llms.txt, the platform page
  and the pricing page; decompiled the first-party SDK (@bigfootai/noded-sdk@0.1.2) and found no
  handling of 429, Retry-After, X-RateLimit-* or RateLimit-* anywhere, and no retry/backoff logic
  at all — the SDK raises a NodedError and stops. Live observation was not possible: the GraphQL
  host api.getnoded.ai does not resolve in public DNS, so no unauthenticated response headers
  could be captured.
