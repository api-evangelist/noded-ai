name: Noded AI
description: 'Noded AI is a customer context graph for customer success, retention, and
  growth teams. It consumes customer data scattered across 20+ tools — call recordings
  (Gong, Zoom, Meet, Fathom, Fireflies, Granola), email, notes, support tickets (Zendesk),
  CRM (Salesforce, HubSpot), and product/engineering signals (Linear, Jira) — and weaves every
  account into one living story, then surfaces a no-nonsense assessment of renewal or churn in
  minutes rather than months. Noded turns mentions of new teams, integrations, or initiatives
  across the customer ecosystem into qualified plays, and acts wherever teams already work:
  answering @noded questions in Slack, drafting QBR decks from the live account story,
  updating Salesforce fields, and filing Linear tickets. Since mid-2026 Noded also ships a
  developer surface: a first-party browser SDK (@bigfootai/noded-sdk on npm) over an Apollo
  GraphQL API at api.getnoded.ai/api/v1/graph, OIDC auth against a Noded-hosted Auth0 tenant,
  a provider-published AGENTS.md for coding agents, an llms.txt, and a single hosted MCP layer
  that exposes the whole customer stack to Claude, ChatGPT, and Gemini with per-agent tool
  scoping and one identity per agent workload. Developer credentials (issuer, client ID, API
  audience) and the MCP endpoint are provisioned by the Noded team on request rather than
  self-serve, and no OpenAPI, GraphQL SDL, or public API reference is published.'
