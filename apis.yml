apis:
- name: Noded GraphQL API
  description: >-
    The Noded (Apollo) GraphQL API behind the Customer Context Graph. One POST endpoint serving
    people and accounts (both modelled as tags), the unified activity timeline (blocks: notes,
    emails, tasks, messages, meeting transcriptions, events), note write-back, and graph memory
    (topic/value/confidence entries the graph has learned about a person or account). Consumed
    through the first-party @bigfootai/noded-sdk typed helpers or directly via the SDK's
    graphql() escape hatch. Auth is OIDC (browser), a caller-supplied bearer token, or a
    server-only API key; every call is scoped to the signed-in user's tenant and permissions.
    Credentials are provisioned by Noded on request — there is no self-serve key flow, no
    published SDL, and no public API reference beyond the developer page.
  humanURL: https://www.getnoded.ai/developers
  baseURL: https://api.getnoded.ai/api/v1/graph
