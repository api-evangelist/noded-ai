note: >-
  Assertions are limited to what Noded actually publishes. Noded is a SaaS application with a
  GraphQL API and a hosted MCP layer; most REST-shaped standards below are simply not applicable
  and are recorded as conforms:false with that reason rather than left out.
standards:
  - id: oidc
    name: OpenID Connect Core 1.0
    conforms: true
    evidence: >-
      Browser auth is OIDC authorization-code with PKCE against a Noded-hosted Auth0 tenant
      (issuer https://login.getnoded.ai/), requesting openid profile email offline_access with
      an audience parameter, per the developer page and the first-party SDK.
    caveat: >-
      The issuer host does not resolve in public DNS, so /.well-known/openid-configuration
      discovery cannot be verified anonymously.
  - id: oauth2
    name: OAuth 2.0 / 2.1
    conforms: true
    evidence: >-
      Authorization-code + PKCE, refresh tokens via offline_access, Bearer token in the
      Authorization header.
    caveat: >-
      The apiKey mode transports a composite 'Bearer apiKey:<key>:<actAs>' string, which is not
      an OAuth 2.0 access token.
  - id: graphql
    name: GraphQL (June 2018 spec) over HTTP
    conforms: true
    evidence: >-
      Apollo Server at POST /api/v1/graph; standard { data, errors[] } response envelope;
      named operations with typed *Input variables.
  - id: mcp
    name: Model Context Protocol
    conforms: unknown
    evidence: >-
      Noded states it ships a single hosted MCP layer that Claude, ChatGPT and Gemini connect to,
      but publishes no endpoint, no transport detail, and no protocol version, so conformance
      cannot be verified. See mcp/noded-ai-mcp.yml.
  - id: rfc9457
    name: RFC 9457 Problem Details
    conforms: false
    evidence: GraphQL errors[] envelope; no application/problem+json anywhere.
  - id: idempotency
    name: Idempotency keys (draft-ietf-httpapi-idempotency-key-header)
    conforms: false
    evidence: No idempotency key or header is documented in the SDK, developer page, or AGENTS.md.
  - id: pagination
    name: Documented pagination
    conforms: false
    evidence: >-
      Only a `limit` option is exposed; no cursor, offset, page token, or total count is
      documented, so a consumer cannot page deterministically.
  - id: rfc9116
    name: RFC 9116 security.txt
    conforms: false
    evidence: /.well-known/security.txt returns 404 on www.getnoded.ai.
  - id: rfc8594
    name: RFC 8594 Sunset header
    conforms: false
    evidence: No deprecation or sunset policy published.
  - id: openapi
